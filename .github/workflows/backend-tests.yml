# AI Sherpa — Backend pytest CI
#
# 실행 시점: dev3 / main 으로 push, 모든 PR (대상 무관)
# 동작: backend/requirements.txt 의존성만 가벼운 셋으로 설치 + pytest 129+ 케이스 실행
#
# Heavy deps (chromadb / sentence-transformers / Ollama) 는 CI 환경에서 설치 안 함.
# RAGRetriever 가 키워드 fallback 으로 자동 전환되므로 테스트는 그대로 통과.
# LLMEngine.generate 는 Ollama 미연결 시 fallback 응답 — recommend_playbook 테스트
# 의 summary 는 None 또는 fallback 텍스트가 되지만 schema 검증은 통과.

name: backend pytest

on:
  push:
    branches: [dev3, main, geunhyung-dev3]
  pull_request:
    branches: [dev3, main]

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install backend deps (no heavy AI deps)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # 핵심 백엔드만 — chromadb / sentence-transformers / ollama 는 fallback 동작
          pip install fastapi 'uvicorn[standard]' python-multipart sqlalchemy \
            jinja2 python-docx pydantic requests httpx python-dotenv reportlab \
            pytest

      - name: Run pytest
        working-directory: backend
        env:
          # 시스템 환경에 Ollama 없음 → LLMEngine fallback 모드
          OLLAMA_BASE_URL: http://127.0.0.1:11434
          LLM_MODEL: llama3.1:8b
          LLM_TIMEOUT: "5"
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Report summary
        if: always()
        working-directory: backend
        run: |
          echo "::group::Test files"
          ls -la tests/
          echo "::endgroup::"
